# ~/.tmux.conf

# 256 and True color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -as terminal-features ",xterm-ghostty:RGB"

# Focus and passthrough are required by terminal integrations such as
# OpenCode notifications running inside tmux.
set -g focus-events on
set -g allow-passthrough on

# WINDOWS & STATUS BAR
set -g status-position bottom
set -g status-left-length 150
set -g status-right-length 150
set -g status-left '#[fg=white] #{?client_prefix,,} %t #[white]'
set -g status-right '#[fg=green] %H:%M #[fg=default]⏽ #[fg=yellow]󰃭 %d-%m-%Y     #[default]'
set -g display-panes-time 1000

# WINDOW STATUS
set -g status-justify left
setw -g automatic-rename off
setw -g allow-rename off
set-hook -g after-new-session 'rename-window " Terminal"'
bind-key c new-window -n " Terminal"

# Use the terminal palette (Ghostty, GNOME Terminal, etc.)
set -g window-style "fg=default,bg=default"
set -g window-active-style "fg=default,bg=default"
set -g status-style "fg=default,bg=default"
set -g pane-border-lines single
set -g pane-border-style "fg=default,bg=default,hidden"
set -g pane-active-border-style "fg=blue,bg=default,noattr"
setw -g window-status-format "#[fg=colour8,bg=default,nobold,nounderscore][#I] #W"
setw -g window-status-current-format "#[fg=default,bg=default,bold,nounderscore][#[underscore]#I#[nounderscore]] #W"
set -g message-style "fg=black,bg=yellow"
set -g mode-style "fg=default,bg=blue"
set -g display-panes-active-colour colour7
set -g display-panes-colour colour8
bind-key q display-panes

# Shortcuts
unbind-key -n M-g
bind-key -n M-g send-keys "git status -s" Enter

# Plugins
set -g @plugin 'tmux-plugins/tpm'
run-shell '~/.tmux/plugins/tpm/tpm'
