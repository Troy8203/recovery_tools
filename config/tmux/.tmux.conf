# 256 and True color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Mouse support
#set -g mouse on

# WINDOWS
# Borders of panes
set -g pane-border-style fg=#1e1e1e
set -g pane-active-border-style fg=#b4b4b4
# Background of current window
set -g window-active-style bg=#1e1e1e

# STATUS BAR
# Status bar background
set -g status-style "fg=#666666 bg=#1e1e1e"
# Status bar interval of refresh in seconds
#set -g status-interval 15  
# Max length of status bar
set -g status-left-length 150
set -g status-right-length 150
# Left status bar content
#set -g status-left '     #(tmux -V 2>/dev/null)'
#set -g status-left '      Tmux'
set -g status-left ' '
# Right status bar content
#set -g status-right ' #S ⏽ 󰔂 #I·󰔃 #P     '
set -g status-right ' %H:%M ⏽ 󰃭 %d-%m-%Y     '

# MESSAGES
# Warning message
set -g message-style "fg=#1e1e1e bg=#AB4CFE"
# Copy mode
set -g mode-style "fg=#ffffff bg=#AB4CFE"

# DISPLAY PANES
# Time to show panes
set -g display-panes-time 1000
# Active pane highlight color
set -g display-panes-active-colour "#AB4CFE"
# Inactive pane highlight color
set -g display-panes-colour "#cccccc"


# WINDOW STATUS
# Status bar alignment
#set -g status-justify centre
set -g status-justify left
# Ventanas inactivas
setw -g window-status-format "[#I] #W"
# Ventana activa
setw -g window-status-current-format "#[fg=#ffffff][#I] #W"
# Set default windows name
bind-key c new-window -n " Terminal"

