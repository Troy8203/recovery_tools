# Get editor completions based on the config schema 󱩛 ⏽·
# Primary
# 900:#2f2f32
# 800:#464649
# 700:#5d5d5f
# 600:#747476
# 500:#8c8c8d
# 400:#a3a3a4
# 300:#bababb
# 200:#d1d1d1
# 100:#e8e8e8
# Foreground
# fg-900:#2f2f32
# fg-800:#464649
# fg-700:#5d5d5f
# fg-600:#747476
# fg-500:#8c8c8d
# fg-400:#a3a3a4
# fg-300:#bababb
# fg-200:#d1d1d1
# fg-100:#e8e8e8

'$schema' = 'https://starship.rs/config-schema.json'

format = """
 \
$sudo\
$python\
$conda\
$docker_context\
$directory\
${localip}\
${custom.remote_github}\
${custom.remote_gitlab}\
$git_branch\
$git_commit\
$git_metrics\
$git_status\
$git_state\
$fill\
$cmd_duration\
$memory_usage\
$bun\
$deno\
$nodejs\
\n$character
"""

add_newline = true

[custom.start_line]
command='echo "╭"'
when=true
format='[$output](bold)'

[custom.end_line]
command='echo "╰"'
when=true
format='[$output](bold)'

[character]
success_symbol = '[](bold green)'
error_symbol = '[](bold red)'
vimcmd_symbol = "[](green)"
format = ' $symbol '

[os]
disabled = false

[os.symbols]
Fedora = ""

[sudo]
style = 'yellow'
symbol = '󰄛'
disabled = false
format='[$symbol ]($style)'

[directory]
style = ""
truncation_length = 3
truncation_symbol = "…/󰷏 "
read_only = "󱪨 "
format = '[$path]($style) '

[directory.substitutions]
"home" = "󱂶 "
"~" = "~ 󰮜 "
"Documents" = "󱧷 Documents"
"Downloads" = "󱃩 Downloads"
"Music"="󱍚 Music"
"Pictures"="󱃫 Pictures"
"Desktop" = "󱋤  Desktop"
"Videos" = "󱧻 Videos"
"Agetic" = "agetic 󰲃"
"frontend"="frontend 󰾰 "
"backend"="backend "
"portal"="portal 󰾔"
"usb"="󱊟 "
"pendrive"="󱊟"

[localip]
ssh_only = true
style = ""
format = ' [  ]()[$localipv4]($style)'
disabled = false

[git_branch]
symbol = ""
style = "purple"
#format = '[[$symbol]() $branch ⏽]($style)'
format = ' [$branch]($style) ⏽'

[git_commit]
disabled = false
commit_hash_length = 5
style = ""
tag_symbol = ""
only_detached = false
tag_disabled = false
tag_max_candidates = 5
#format = '[ [ ]()$hash [󰓹 ]()$tag ⏽]($style)'
format = '[ [ ]()$tag ⏽]($style)'

[git_metrics]
disabled = true
added_style = 'bold blue'
format = '[+$added]($added_style)/[-$deleted]($deleted_style) '

[git_status]
style = ""
ahead = " 󰭾 "
behind = " 󰭽 "
diverged = " 󰼯 "
up_to_date = " 󱋌 "
conflicted = "󰩌 [$count]()·"
untracked = "󱀶 [$count]()·"
stashed = "󰘓 [$count]()·"
modified = "󱇨 [$count]()·"
staged = "󰻭 [$count]()·"
renamed = "󱀱 [$count]()·"
deleted = "󱀷 [$count]()·"
typechanged = "󱁼 [$count]()·"

format = '[($ahead_behind $all_status)]($style)'

[git_state]
style = ""
rebase = 'REB '
merge = 'MERGE '
revert = 'REVER '
bisect = 'BISEC '
cherry_pick = 'PICK '
am = 'AM '
am_or_rebase = 'AM/REBASE 󰊢'
format = '[( $state  󰈖 $progress_current·󰩋 $progress_total ⏽)]($style) '

[fill]
symbol = ' '
style = 'bold'

[bun]
symbol = " "
style = ""
disabled = false
format = '[$symbol]($style)[$version]()'

[deno]
symbol = " "
style = "green"
disabled = false
format = '[$symbol]($style)[$version ]()'

[nodejs]
symbol = "󰎙 "
style = "green"
version_format = "${major}.${minor}"
not_capable_style = "yellow"
disabled = false
format = '[$symbol]($style)[$version]()[v]()'

[rust]
symbol = ""
style = "blue"
format = ' [$symbol]($style) ($version) '

[golang]
symbol = ""
style = "blue"
format = ' [$symbol]($style) ($version) '

[php]
symbol = ""
style = "blue"
format = ' [$symbol]($style) ($version) '

[python]
symbol = ''
style = "green"
python_binary = 'python3'
format = '${pyenv_prefix}([]($style) \($virtualenv\) )'

[conda]
symbol = ""
style = "green"
ignore_base = false
format = '[$symbol]($style)($environment )'

[docker_context]
symbol = " "
style = "cyan"
only_with_files = false
disabled = false
format = '[$symbol]($style)($context )'

[cmd_duration]
min_time = 500
style = "cyan"
format = ' [󱃑]($style)·$duration ⏽ '

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "green"
format = ' []($style) $time'

[memory_usage]
disabled = false
threshold = 80
symbol = '󱗗 '
style = 'yellow'
format = '[$symbol]($style)($ram_pct ⏽ )'

[line_break]
disabled = false

[container]
symbol = '  '
disabled = false
format = '[$symbol \[$name\]]($style) '

[custom.user]
detect_folders = ['.git']
style = "yellow"
symbol = ""
command = """
user_email=$(git config --global user.email)
  if [[ "$user_email" == *"@agetic.gob.bo"* ]]; then
    echo ""
  else
    echo "󰊤"
  fi
"""
format = '[ ($output)  ]($style)'

[custom.docker]
description = "Shows the docker symbol if the current directory has Dockerfile or docker-compose.yml files"
command = "echo 🐳"
files = ["Dockerfile", "docker-compose.yml", "docker-compose.yaml"]
when = """ command -v docker &> /dev/null; exit (echo $?); """
prefix = "on "


[custom.gitlab]
detect_folders = ['.git']
style = "yellow"
symbol = ""
command = """
account="@agetic.gob.bo"
logo=""
user_email=$(git config --global user.email)
if [[ "$user_email" == *$account* ]]; then
    echo "\b $logo   \b"
fi
"""
format = '[$symbol ($output)]($style)'

[custom.github]
detect_folders = ['.git']
style = ""
symbol = ""
command = """
account="@gmail.com"
logo=""
user_email=$(git config --global user.email)
if [[ "$user_email" == *$account* ]]; then
    echo "\b $logo   \b"
fi
"""
format = '[$symbol ($output)]($style)'


[custom.remote_github]
detect_folders = ['.git']
style = ""
symbol = ""
command = """
logo=""
remote_url=$(git remote get-url origin)
if [[ "$remote_url" == *"github"* ]]; then
    echo "\b $logo \b"
fi
"""
format = '[$symbol ($output)]($style)'

[custom.remote_gitlab]
detect_folders = ['.git']
style = "yellow"
symbol = ""
command = """
logo=""
remote_url=$(git remote get-url origin)
if [[ "$remote_url" == *"gitlab"* ]]; then
    echo "\b$logo  \b"
fi
"""
format = '[$symbol ($output)]($style)'

# Claude Code status line modules.
[profiles]
claude-code = "$claude_model$claude_context$claude_cost"

[claude_model]
symbol = "󰛄 "
style = "yellow"
format = '[ $symbol$model ⏽]($style)'

[claude_context]
format = '[ $gauge $percentage ($input_tokens/$output_tokens) ⏽]($style)'
gauge_width = 10
gauge_full_symbol = '█'
gauge_partial_symbol = '▒'
gauge_empty_symbol = '░'

[[claude_context.display]]
threshold = 0
style = "green"

[[claude_context.display]]
threshold = 60
style = "yellow"

[[claude_context.display]]
threshold = 80
style = "red"

[claude_cost]
symbol = " "
format = '[ $symbol$cost ⏽]($style)'

[[claude_cost.display]]
threshold = 0.0
style = ""

[[claude_cost.display]]
threshold = 1.0
style = "yellow"

[[claude_cost.display]]
threshold = 5.0
style = "red"
